name: CI-CD

on:
  push:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY_DEV }}
          known_hosts: "secret"

      - name: Adding Known Hosts
        run: ssh-keyscan -H wedding.anonychun.com >> ~/.ssh/known_hosts

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wedding-web:latest

      - name: Deploy
        run: |
          ssh root@wedding.anonychun.com "cd /opt/anonychun/wedding && docker compose pull web"
          ssh root@wedding.anonychun.com "cd /opt/anonychun/wedding && docker compose down web"
          ssh root@wedding.anonychun.com "cd /opt/anonychun/wedding && docker compose up -d web"
          ssh root@wedding.anonychun.com "docker system prune -af || true"
